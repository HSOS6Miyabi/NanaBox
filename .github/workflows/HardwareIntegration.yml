name: Hyper-V hardware integration

on:
  workflow_dispatch:
    inputs:
      windows_config:
        description: Absolute path to a disposable Windows guest .7b on the runner
        required: true
        type: string
      linux_config:
        description: Absolute path to a disposable Linux guest .7b on the runner
        required: true
        type: string

      test_address:
        description: Literal IP of a reachable test TCP server (external to both guests)
        required: true
        type: string
      test_port:
        description: TCP port of the test server
        required: true
        type: number
      windows_gpu_pattern:
        description: Regex matching the expected Windows guest GPU name or hardware ID
        required: true
        type: string
      linux_gpu_pattern:
        description: 'Regex matching the expected Linux GPU vendor/device ID or Dxg state'
        required: true
        type: string

permissions:
  contents: read

jobs:
  hardware:
    runs-on: [self-hosted, Windows, X64, nanabox-hyperv]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build
        run: msbuild BuildAllTargets.proj
      - name: Settings UI
        shell: powershell
        run: |
          & .\Tests\SettingsUI.ps1 -Executable .\Output\Binaries\Root\Binaries\x64\NanaBox.exe -OutputDirectory "$env:RUNNER_TEMP\NanaBox-UI" -HostIntegration
      - name: Hyper-V integration
        shell: powershell
        env:
          NANABOX_WINDOWS_CONFIG: ${{ inputs.windows_config }}
          NANABOX_LINUX_CONFIG: ${{ inputs.linux_config }}
          NANABOX_TEST_ADDRESS: ${{ inputs.test_address }}
          NANABOX_TEST_PORT: ${{ inputs.test_port }}
          NANABOX_WINDOWS_GPU: ${{ inputs.windows_gpu_pattern }}
          NANABOX_LINUX_GPU: ${{ inputs.linux_gpu_pattern }}
        run: |
          & .\Tests\HyperVIntegration.ps1 -Executable .\Output\Binaries\Root\Binaries\x64\NanaBox.exe -WindowsConfig $env:NANABOX_WINDOWS_CONFIG -LinuxConfig $env:NANABOX_LINUX_CONFIG -TestAddress $env:NANABOX_TEST_ADDRESS -TestPort ([int]$env:NANABOX_TEST_PORT) -WindowsGpuPattern $env:NANABOX_WINDOWS_GPU -LinuxGpuPattern $env:NANABOX_LINUX_GPU
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NanaBox-Hardware-Diagnostics
          path: ${{ runner.temp }}/NanaBox-UI
          if-no-files-found: ignore
