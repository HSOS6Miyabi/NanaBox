name: GuestTool Tests

on:
  push:
    paths:
      - 'GuestTool/**'
      - '.github/workflows/TestGuestTool.yml'
  pull_request:
    paths:
      - 'GuestTool/**'
      - '.github/workflows/TestGuestTool.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s GuestTool -v
      - name: Validate Linux installation scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n GuestTool/InstallLinuxGuest.sh
          bash -n GuestTool/UninstallLinuxGuest.sh
      - name: Build and test native Plan 9 GuestTool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-json-dev
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread GuestTool/Plan9.cpp -o GuestTool/nanabox-plan9
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread GuestTool/Plan9Tests.cpp -o /tmp/nanabox-plan9-tests
          /tmp/nanabox-plan9-tests
      - name: Reconcile real Linux interfaces and routes in a network namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net "$(command -v python)" GuestTool/live_network_test.py
          sudo unshare --net "$(command -v python)" GuestTool/live_loopback_test.py
      - name: Package guest service
        uses: actions/upload-artifact@v7
        with:
          name: NanaBox-GuestTool-${{ matrix.os }}
          path: |
            GuestTool/gns.py
            GuestTool/nanabox-plan9
            GuestTool/Plan9.cpp
            GuestTool/*.ps1
            GuestTool/*.sh
            GuestTool/*.service
            GuestTool/*.c
            GuestTool/README.md
