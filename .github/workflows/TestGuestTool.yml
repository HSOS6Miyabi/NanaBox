name: GuestTool Tests

on:
  push:
    paths:
      - 'GuestTool/**'
      - '.github/workflows/TestGuestTool.yml'
  pull_request:
    paths:
      - 'GuestTool/**'
      - '.github/workflows/TestGuestTool.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s GuestTool -v
      - name: Validate Linux installation scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n GuestTool/InstallLinuxGuest.sh
          bash -n GuestTool/UninstallLinuxGuest.sh
      - name: Build and test native Plan 9 GuestTool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-json-dev
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread GuestTool/Plan9.cpp -o GuestTool/nanabox-plan9
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread GuestTool/Plan9Tests.cpp -o /tmp/nanabox-plan9-tests
          /tmp/nanabox-plan9-tests
      - name: Reconcile real Linux interfaces and routes in a network namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net "$(command -v python)" GuestTool/live_network_test.py
          sudo unshare --net "$(command -v python)" GuestTool/live_loopback_test.py
      - name: Build and test Windows GPU GuestTool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC was not found' }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install nlohmann-json:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          $cmd = 'call "' + $vs + '\VC\Auxiliary\Build\vcvars64.bat" && cl /nologo /EHsc /std:c++17 /W4 /O2 /MT /I"' + $inc + '" GuestTool\WddmGuest.cpp /Fe:GuestTool\nanabox-gpu.exe'
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\GuestTool\nanabox-gpu.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test native Linux GuestTool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y nlohmann-json3-dev libssl-dev
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread GuestTool/GuestTool.cpp -lcrypto -o GuestTool/nanabox-guest-tool
          GuestTool/nanabox-guest-tool --self-test
      - name: Build and test native Windows GuestTool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC was not found' }
          $inc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          $cmd = 'call "' + $vs + '\VC\Auxiliary\Build\vcvars64.bat" && cl /nologo /EHsc /std:c++17 /W4 /O2 /MT /I"' + $inc + '" GuestTool\GuestTool.cpp /Fe:GuestTool\nanabox-guest-tool.exe'
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\GuestTool\nanabox-guest-tool.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package guest service
        uses: actions/upload-artifact@v7
        with:
          name: NanaBox-GuestTool-${{ matrix.os }}
          path: |
            GuestTool/gns.py
            GuestTool/GuestTool.cpp
            GuestTool/nanabox-guest-tool
            GuestTool/nanabox-guest-tool.exe
            GuestTool/nanabox-plan9
            GuestTool/Plan9.cpp
            GuestTool/WddmGuest.cpp
            GuestTool/WddmMapping.h
            GuestTool/nanabox-gpu.exe
            GuestTool/*.ps1
            GuestTool/*.sh
            GuestTool/*.service
            GuestTool/*.c
            GuestTool/README.md
