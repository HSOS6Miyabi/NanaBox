name: GuestTool Tests

on:
  push:
    paths:
      - 'GuestTool/**'
      - 'Tests/GuestProtocolReference/**'
      - '.github/workflows/TestGuestTool.yml'
  pull_request:
    paths:
      - 'GuestTool/**'
      - 'Tests/GuestProtocolReference/**'
      - '.github/workflows/TestGuestTool.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s Tests/GuestProtocolReference -v
      - name: Validate Linux installation scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n GuestTool/InstallLinuxGuest.sh
          bash -n GuestTool/UninstallLinuxGuest.sh
      - name: Build and test native Plan 9 GuestTool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-json-dev
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread GuestTool/Plan9.cpp -o GuestTool/nanabox-plan9
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread GuestTool/Plan9Tests.cpp -o /tmp/nanabox-plan9-tests
          /tmp/nanabox-plan9-tests
      - name: Reconcile real Linux interfaces and routes in a network namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net "$(command -v python)" Tests/GuestProtocolReference/live_network_test.py
          sudo unshare --net "$(command -v python)" Tests/GuestProtocolReference/live_loopback_test.py
      - name: Build and test Windows GuestTool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\GuestTool\BuildWindowsGuestTool.ps1 -RunTests
          .\GuestTool\BuildWindowsGuestTool.ps1 -Architecture arm64 -OutputDirectory (Join-Path $PWD 'GuestTool\arm64')
      - name: Build and test native Linux GuestTool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y nlohmann-json3-dev libssl-dev
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread GuestTool/GuestTool.cpp -lcrypto -o GuestTool/nanabox-guest-tool
          GuestTool/nanabox-guest-tool --self-test
          sudo unshare --net GuestTool/nanabox-guest-tool --network-self-test
          sudo unshare --net GuestTool/nanabox-guest-tool --loopback-self-test
          GuestTool/nanabox-guest-tool --bind-self-test
      - name: Verify and bundle the pinned Mile.Cirno release
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\GuestTool\PrepareCirnoPackage.ps1
      - name: Package guest service
        uses: actions/upload-artifact@v7
        with:
          name: NanaBox-GuestTool-${{ matrix.os }}
          path: |
            GuestTool/GuestTool.cpp
            GuestTool/GuestNetwork.h
            GuestTool/DnsTunnel.h
            GuestTool/LoopbackRouting.h
            GuestTool/BindCoordinator.h
            GuestTool/WindowsNetworkScripts.h
            GuestTool/nanabox-guest-tool
            GuestTool/nanabox-guest-tool.exe
            GuestTool/nanabox-plan9
            GuestTool/Plan9.cpp
            GuestTool/WddmGuest.cpp
            GuestTool/WddmMapping.h
            GuestTool/nanabox-gpu.exe
            GuestTool/arm64/*.exe
            GuestTool/Cirno.zip
            GuestTool/*.ps1
            GuestTool/*.sh
            GuestTool/*.service
            GuestTool/*.c
            GuestTool/README.md
