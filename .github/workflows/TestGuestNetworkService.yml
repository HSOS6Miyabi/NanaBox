name: Guest Network Service Tests

on:
  push:
    paths:
      - 'GuestNetworkService/**'
      - '.github/workflows/TestGuestNetworkService.yml'
  pull_request:
    paths:
      - 'GuestNetworkService/**'
      - '.github/workflows/TestGuestNetworkService.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s GuestNetworkService -v
      - name: Validate Linux installation scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n GuestNetworkService/InstallLinuxGuest.sh
          bash -n GuestNetworkService/UninstallLinuxGuest.sh
      - name: Reconcile real Linux interfaces and routes in a network namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net "$(command -v python)" GuestNetworkService/live_network_test.py
          sudo unshare --net "$(command -v python)" GuestNetworkService/live_loopback_test.py
      - name: Package guest service
        uses: actions/upload-artifact@v7
        with:
          name: NanaBox-GuestNetworkService-${{ matrix.os }}
          path: |
            GuestNetworkService/gns.py
            GuestNetworkService/*.ps1
            GuestNetworkService/*.sh
            GuestNetworkService/*.service
            GuestNetworkService/README.md
