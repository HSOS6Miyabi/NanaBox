name: Windows 9P WinFsp tests
on:
  push:
    paths:
      - 'GuestTool/Plan9Client.h'
      - 'GuestTool/WindowsPlan9Mounts.h'
      - 'GuestTool/WddmGuest.cpp'
      - 'GuestTool/BuildWindowsGuestTool.ps1'
      - 'Tests/WindowsPlan9ManagerIntegration.py'
      - 'GuestTool/WinFspPlan9.cpp'
      - 'GuestTool/BuildWindowsPlan9.ps1'
      - 'Tests/InstallWinFspSdk.ps1'
      - 'Tests/WinFspPlan9Integration.py'
      - '.github/workflows/WinFspPlan9.yml'
  pull_request:
    paths:
      - 'GuestTool/Plan9Client.h'
      - 'GuestTool/WindowsPlan9Mounts.h'
      - 'GuestTool/WddmGuest.cpp'
      - 'GuestTool/BuildWindowsGuestTool.ps1'
      - 'Tests/WindowsPlan9ManagerIntegration.py'
      - 'GuestTool/WinFspPlan9.cpp'
      - 'GuestTool/BuildWindowsPlan9.ps1'
      - 'Tests/InstallWinFspSdk.ps1'
      - 'Tests/WinFspPlan9Integration.py'
      - '.github/workflows/WinFspPlan9.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned WinFsp SDK
        shell: pwsh
        run: .\Tests\InstallWinFspSdk.ps1
      - name: Build and test native Windows 9P filesystem
        shell: pwsh
        run: |
          .\GuestTool\BuildWindowsPlan9.ps1
          .\GuestTool\BuildWindowsGuestTool.ps1
          python Tests/WinFspPlan9Integration.py GuestTool/nanabox-plan9-winfsp.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tests/WindowsPlan9ManagerIntegration.py GuestTool/nanabox-gpu.exe GuestTool/nanabox-plan9-winfsp.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\GuestTool\BuildWindowsPlan9.ps1 -Architecture arm64 -OutputDirectory (Join-Path $PWD 'GuestTool\arm64')
      - uses: actions/upload-artifact@v7
        with:
          name: NanaBox-WinFsp-Plan9
          path: |
            GuestTool/nanabox-plan9-winfsp.exe
            GuestTool/arm64/nanabox-plan9-winfsp.exe
            GuestTool/Plan9Client.h
            GuestTool/WindowsPlan9Mounts.h
            GuestTool/WinFspPlan9.cpp
            GuestTool/BuildWindowsPlan9.ps1
            GuestTool/README.md
